# Branch Protection Rules for Aegis Agent
# This file documents the intended branch protection configuration.
# These rules must be applied manually via GitHub UI or GitHub API.
#
# GitHub does not support branch protection rules via YAML config files natively.
# Use the `gh api` CLI or GitHub Settings UI to apply these.

main:
  description: "Production branch — all merges must go through develop first"
  rules:
    required_pull_request_reviews:
      required_approving_review_count: 2
      dismiss_stale_reviews: true
      require_code_owner_reviews: true
    required_status_checks:
      strict: true
      contexts:
        - "Lint & Type Check"
        - "Test"
        - "Build"
        - "Security Audit"
    enforce_admins: false
    restrictions:
      # Only release managers can push directly (emergency hotfixes)
      # After setup, restrict 'push' to specific teams/users
      users: []
      teams: []
    allow_force_pushes: false
    allow_deletions: false
    block_creates: true

develop:
  description: "Main development branch — standard CI checks"
  rules:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    required_status_checks:
      strict: true
      contexts:
        - "Lint & Type Check"
        - "Test"
        - "Build"
    enforce_admins: false
    restrictions: null
    allow_force_pushes: false
    allow_deletions: false

# How to apply via GitHub CLI:
#
# For main:
#   gh api -X PUT repos/shira022/aegis-agent/branches/main/protection \
#     -f required_status_checks[strict]=true \
#     -f required_status_checks[contexts][]="Lint & Type Check" \
#     -f required_status_checks[contexts][]="Test" \
#     -f required_status_checks[contexts][]="Build" \
#     -f required_status_checks[contexts][]="Security Audit" \
#     -f required_pull_request_reviews[required_approving_review_count]=2 \
#     -f required_pull_request_reviews[dismiss_stale_reviews]=true \
#     -f required_pull_request_reviews[require_code_owner_reviews]=true
#
# For develop:
#   gh api -X PUT repos/shira022/aegis-agent/branches/develop/protection \
#     -f required_status_checks[strict]=true \
#     -f required_status_checks[contexts][]="Lint & Type Check" \
#     -f required_status_checks[contexts][]="Test" \
#     -f required_status_checks[contexts][]="Build" \
#     -f required_pull_request_reviews[required_approving_review_count]=1 \
#     -f required_pull_request_reviews[dismiss_stale_reviews]=true
