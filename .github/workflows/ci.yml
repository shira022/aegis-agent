name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: TypeScript type check
        run: pnpm run typecheck

  rust:
    name: Rust Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # `cargo test --lib` type-checks and unit-tests the backend only; it never
      # bundles the frontend. tauri-build still validates the configured
      # frontendDist path, so give it a placeholder.
      - name: Provide placeholder frontend dist for tauri-build
        run: |
          mkdir -p apps/desktop/dist
          printf '<!doctype html>\n<title>ci placeholder</title>\n' > apps/desktop/dist/index.html

      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Run backend tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # `too_many_arguments` is allowed explicitly: `ai_client/providers.rs` has a
      # pre-existing 8-argument request builder. Everything else is fatal.
      - name: Run Clippy
        run: |
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --all-targets -- -D warnings -A clippy::too_many_arguments

  text-locale:
    name: English-Only Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for non-English text in source files
        run: bash scripts/check-no-japanese.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            packages/**/coverage/
            apps/**/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Verify build outputs exist
        run: |
          echo "Verifying build outputs..."
          for pkg in packages/@aegis/*/; do
            if [ -d "$pkg/dist" ]; then
              echo "✓ $pkg has dist/"
            else
              echo "⚠ $pkg has no dist/ (may be expected for source-only packages)"
            fi
          done

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (high severity)
        run: pnpm audit --audit-level=high || echo "::warning::Audit found vulnerabilities. Review output above."

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
