[package]
name = "aegis-agent"
version = "0.1.0"
description = "Aegis Agent - Desktop App"
authors = ["Aegis Team"]
edition = "2021"

[lib]
name = "aegis_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.6"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# HTTP client for real AI provider calls. rustls only: no OpenSSL/openssl-sys.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# OS keychain backends per platform.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows", target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
